name: Verificações

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix backend run db:generate
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t fintech-flow:ci .
      - name: Verificar aplicativo e Swagger na imagem
        run: |
          export JWT_SECRET="$(openssl rand -hex 48)"
          docker run -d --name fintech-flow-ci -p 127.0.0.1:3333:3333 -e JWT_SECRET \
            --mount type=volume,source=fintech-flow-ci-data,target=/app/data fintech-flow:ci
          trap 'docker logs fintech-flow-ci; docker rm -f fintech-flow-ci' EXIT
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:3333/api/health
          curl -fsS http://127.0.0.1:3333/ | grep -F 'FinTech Flow'
          curl -fsS http://127.0.0.1:3333/api/openapi.json | jq -e '.openapi == "3.0.3"'
