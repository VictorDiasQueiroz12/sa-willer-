services:
  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo de deploy}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3333}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "127.0.0.1:${APP_PORT:-3333}:3333"
    volumes:
      - treasury-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  treasury-data:
